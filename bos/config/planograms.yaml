# ---
# id: bos.config.planograms
# purpose: Planogram definitions — what SKU sits in each machine and how much (the
#          refill-to-par plan). machines_state.json references these by id. reorder.py
#          uses them to build a real per-SKU purchase order. Lines validate against
#          schema/planogram_line.schema.json; SKUs must exist in data/products.json.
# model: facings = how many selections a SKU occupies (top sellers get more);
#        par_each = max units per facing. Units to hold = facings * par_each.
# gusto8_layout: 48 selections (24 snack / 8 food / 16 bottles), ~390 items, 7 trays.
# evidence: SKU choice from data/products.json (catalog). PAR LEVELS ARE A SPIKE —
#           see scratch/spikes/007-planogram-par-levels.md — until depletion/telemetry
#           data discharges them. Tune par_each, not the structure.
# consumed_by: [tools/reorder.py, tools/validate.py]
# updated: 2026-06-15
# ---
_meta:
  id: bos.config.planograms

